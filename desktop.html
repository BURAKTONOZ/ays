<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetim Paneli | Numarataj Araç Filo</title>
<!-- Tailwind CDN kaldırıldı, yerel derlenmiş dosya eklendi -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-wrapper">
 <!-- TITLEBAR -->
 <div class="h-10 bar flex justify-between items-center px-4 shrink-0 drag-area z-[200]">
  <div class="flex items-center gap-3 text-gray-400 text-[10px] font-bold tracking-widest no-drag">
   <i class="fa-solid fa-shield-halved text-blue-500"></i>NUMARATAJ FİLO MERKEZ
  </div>
  <div class="flex items-center gap-4 no-drag">
   <button id="win-min" class="text-gray-400 hover:text-white hover:bg-white/10 p-1.5 rounded transition"><i class="fa-solid fa-minus"></i></button>
   <button id="win-max" class="text-gray-400 hover:text-white hover:bg-white/10 p-1.5 rounded transition"><i class="fa-regular fa-window-maximize"></i></button>
   <button id="win-close" class="text-gray-400 hover:text-white hover:bg-red-500 p-1.5 rounded transition"><i class="fa-solid fa-xmark"></i></button>
  </div>
 </div>

 <!-- LOGIN -->
 <div id="admin-login-screen" class="absolute inset-y-10 inset-x-0 z-[90] bg-[#030612]/95 hidden items-center justify-center p-4">
  <div class="glass-modal w-full max-w-sm flex flex-col pop-in border-blue-500/30 border-2">
   <div class="p-6 border-b border-white/10 flex flex-col items-center text-center">
    <div class="w-16 h-16 bg-blue-500/20 rounded-full flex items-center justify-center mb-3"><i class="fa-solid fa-lock text-3xl text-blue-400"></i></div>
    <h3 class="font-extrabold text-xl text-white">Güvenli Giriş</h3>
   </div>
   <form id="form-admin-login" class="p-6 space-y-5 no-drag">
    <input type="password" id="al-pw" class="w-full p-4 text-center font-bold tracking-widest" placeholder="Yönetici Şifresi" required>
    <button type="submit" class="btn-3d btn-blue w-full py-4 text-lg">Giriş Yap</button>
   </form>
  </div>
 </div>

 <div id="toast-container" class="absolute top-12 right-6 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

 <!-- ANA UYGULAMA -->
 <div id="app" class="hidden flex-1 min-h-0 w-full relative">
  <div class="flex w-full h-full">
   <!-- SOL MENÜ -->
   <aside class="side flex w-64 shrink-0 flex-col p-4 no-drag transition-all duration-300">
    <div class="flex items-center gap-3 px-2 py-4 mb-4 border-b border-white/10">
     <div class="bg-gradient-to-br from-blue-500 to-indigo-700 p-3 rounded-xl border border-blue-400/40"><i class="fa-solid fa-truck-fast text-2xl text-white"></i></div>
     <div><div class="font-extrabold text-white leading-tight text-sm">FİLO YÖNETİM</div><div class="text-[.6rem] text-blue-300 font-bold uppercase tracking-[.15em] mt-1" id="hdr-org">Numarataj Şube</div></div>
    </div>
    <nav class="space-y-2 flex-1">
     <button class="nav-btn active" data-tab="dash" onclick="window.switchAdminTab('dash')"><i class="fa-solid fa-chart-pie"></i>Dashboard</button>
     <button class="nav-btn" data-tab="records" onclick="window.switchAdminTab('records')"><i class="fa-solid fa-list"></i>Görev Kayıtları</button>
     <button class="nav-btn" data-tab="fleet" onclick="window.switchAdminTab('fleet')"><i class="fa-solid fa-car"></i>Araç Filosu</button>
     <button class="nav-btn" data-tab="users" onclick="window.switchAdminTab('users')"><i class="fa-solid fa-users"></i>Personel</button>
     <button class="nav-btn" data-tab="settings" onclick="window.switchAdminTab('settings')"><i class="fa-solid fa-gear"></i>Ayarlar</button>
    </nav>
    <div class="mt-auto pt-4 border-t border-white/10 flex items-center justify-between px-2">
     <div class="flex items-center gap-2" id="conn-status">
      <span class="w-2 h-2 rounded-full bg-red-500"></span><span class="text-[10px] font-bold text-red-500 uppercase">Bağlanıyor...</span>
     </div>
    </div>
   </aside>

   <!-- SAĞ İÇERİK -->
   <div class="flex-1 min-w-0 flex flex-col h-full bg-[#030612]/30 relative no-drag">
    <header class="bar w-full shrink-0 px-6 py-4 flex items-center justify-between gap-3 shadow-lg z-10">
     <div class="min-w-0"><h2 id="page-title" class="text-xl font-extrabold text-white truncate tracking-wide">Dashboard</h2></div>
     <div class="flex items-center gap-3 shrink-0">
      <button onclick="window.openVehicleForm()" class="btn-3d btn-blue px-4 py-2.5 text-sm"><i class="fa-solid fa-plus mr-2"></i>Yeni Araç</button>
      <button onclick="window.openManualMissionForm()" class="btn-3d btn-yellow px-4 py-2.5 text-sm"><i class="fa-solid fa-file-pen mr-2"></i>Elle Kayıt Gir</button>
     </div>
    </header>

    <main id="admin-main" class="flex-1 min-h-0 w-full overflow-y-auto p-6 relative">
     <!-- Sekme içerikleri buraya JS ile yüklenecek (Kısa tutulmuştur, önceki tasarım yapısı korunacaktır) -->
     <div id="admin-dash" class="space-y-6 w-full">
         <div class="grid grid-cols-2 lg:grid-cols-4 gap-5">
             <div class="stat glass p-6 border-b-4 border-b-gray-400"><i class="ico fa-solid fa-layer-group"></i><p class="ch-title">Toplam Araç</p><h3 id="dash-tot-veh" class="text-4xl font-black text-white">0</h3></div>
             <!-- Diğer stat kartları... -->
         </div>
     </div>
     <div id="admin-records" class="hidden h-full flex-col w-full"></div>
     <div id="admin-fleet" class="hidden w-full"><div id="fleet-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div></div>
     <div id="admin-users" class="hidden h-full flex-col w-full"></div>
     <div id="admin-settings" class="hidden space-y-6 pb-10 w-full"></div>
    </main>
   </div>
  </div>
 </div>
</div>

<!-- GÜNCELLENMİŞ MODALLAR (Merkezleme ve eksik alanlar çözüldü) -->
<div id="modal-overlay" class="fixed inset-0 bg-[#030612]/90 backdrop-blur-md z-[500] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4 overflow-y-auto no-drag">
 
 <!-- ARAÇ FORMU (Eksikler Giderildi) -->
 <div id="modal-vehicle-form" class="glass-modal w-full max-w-3xl hidden flex-col max-h-[90vh]">
  <div class="flex justify-between items-center p-6 border-b border-white/10 bg-[#0f152e] rounded-t-[20px]">
      <h3 id="vf-title" class="text-xl font-extrabold text-white">Araç</h3>
      <button class="modal-close text-textmuted hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
  </div>
  <form id="form-vehicle" class="p-8 space-y-6 overflow-y-auto"><input type="hidden" id="vf-id">
   <div class="grid sm:grid-cols-2 gap-5">
    <div><label class="block text-xs font-bold text-textmuted mb-2">Plaka *</label><input type="text" id="vf-plate" class="w-full p-3 uppercase font-black text-center" required></div>
    <div><label class="block text-xs font-bold text-textmuted mb-2">Model *</label><input type="text" id="vf-model" class="w-full p-3 font-bold" required></div>
    <div><label class="block text-xs font-bold text-textmuted mb-2">Şasi No (VIN)</label><input type="text" id="vf-vin" class="w-full p-3 uppercase font-mono"></div>
    <div class="flex gap-2">
        <div class="w-1/2"><label class="block text-xs font-bold text-textmuted mb-2">Yıl</label><input type="number" id="vf-year" class="w-full p-3"></div>
        <div class="w-1/2"><label class="block text-xs font-bold text-textmuted mb-2">Renk</label><input type="text" id="vf-color" class="w-full p-3"></div>
    </div>
    <div><label class="block text-xs font-bold text-textmuted mb-2">Güncel KM *</label><input type="number" id="vf-km" class="w-full p-3 font-black text-blue-400 text-center" required></div>
    <div><label class="block text-xs font-bold text-textmuted mb-2">Yakıt</label><select id="vf-fuel" class="w-full p-3"><option>Dizel</option><option>Benzin</option><option>Elektrik</option></select></div>
    <div><label class="block text-xs font-bold text-textmuted mb-2">Muayene Bitiş</label><input type="date" id="vf-ins" class="w-full p-3"></div>
    <div id="vf-status-box" class="hidden"><label class="block text-xs font-bold text-textmuted mb-2">Durum</label><select id="vf-status" class="w-full p-3 font-bold"><option value="available">Müsait</option><option value="maintenance">Sanayide</option></select></div>
   </div>
   <div><label class="block text-xs font-bold text-textmuted mb-2">Araç Notu</label><textarea id="vf-notes" class="w-full p-3" rows="2"></textarea></div>
   <button type="submit" class="btn-3d btn-green w-full py-4 text-lg">Kaydet</button>
  </form>
 </div>

 <!-- PERSONEL FORMU (Eksik alanlar eklendi) -->
 <div id="modal-user-form" class="glass-modal w-full max-w-md hidden flex-col">
  <div class="flex justify-between items-center p-6 border-b border-white/10 bg-[#0f152e] rounded-t-[20px]"><h3 id="uf-title" class="text-xl font-extrabold text-white">Personel</h3><button class="modal-close text-textmuted"><i class="fa-solid fa-xmark text-2xl"></i></button></div>
  <form id="form-user" class="p-8 space-y-5"><input type="hidden" id="uf-id">
   <input type="text" id="uf-name" class="w-full p-3 font-bold text-lg" placeholder="Ad Soyad" required>
   <div class="grid grid-cols-2 gap-5">
    <input type="text" id="uf-sicil" class="w-full p-3" placeholder="Sicil">
    <input type="text" id="uf-phone" class="w-full p-3" placeholder="Telefon">
   </div>
   <input type="text" id="uf-lic" class="w-full p-3 text-center" placeholder="Ehliyet (Örn: B, E)">
   <div class="bg-blue-900/20 p-2 rounded-xl border border-blue-500/20"><label class="block text-xs font-bold text-blue-300 text-center mt-1">4 Haneli PIN</label><input type="password" id="uf-pin" maxlength="4" class="w-full p-3 text-center tracking-[1em] font-extrabold text-2xl bg-black/50 text-white" placeholder="••••"></div>
   <div id="uf-status-box" class="hidden"><select id="uf-active" class="w-full p-3 font-bold"><option value="true">Aktif</option><option value="false">Pasif</option></select></div>
   <button type="submit" class="btn-3d btn-green w-full py-4">Kaydet</button>
  </form>
 </div>

 <!-- ELLE KAYIT FORMU (Eksik Not alanı eklendi) -->
 <div id="modal-manual-mission" class="glass-modal w-full max-w-2xl hidden flex-col">
     <!-- Kod kalabalığını önlemek için form içeriği script.js tarafından yönetilir -->
     <form id="form-manual-mission" class="p-8 space-y-4">
         <div class="grid sm:grid-cols-2 gap-4">
             <select id="mm-user" class="p-3 w-full" required></select>
             <select id="mm-vehicle" class="p-3 w-full" onchange="window.updateManualVehicleKm()" required></select>
         </div>
         <div class="grid grid-cols-2 gap-4">
             <input type="datetime-local" id="mm-start-time" class="p-3 w-full" required>
             <input type="datetime-local" id="mm-end-time" class="p-3 w-full" required>
             <input type="number" id="mm-start-km" class="p-3 w-full font-black" placeholder="Çıkış KM" required>
             <input type="number" id="mm-end-km" class="p-3 w-full font-black" placeholder="Dönüş KM" required>
         </div>
         <input type="text" id="mm-dest" class="p-3 w-full" placeholder="Güzergah" required>
         <input type="text" id="mm-note" class="p-3 w-full" placeholder="Görev Notu / Şikayet (Opsiyonel)">
         <button type="submit" class="btn-3d btn-yellow w-full py-4">Kaydı Tamamla</button>
     </form>
 </div>

 <!-- DİĞER MODALLAR (Bakım, Muayene, Düzeltme vs...) -->
 <div id="modal-maint" class="glass-modal w-full max-w-md hidden flex-col"><form id="form-maint" class="p-8"><input type="hidden" id="mt-vid"><select id="mt-type" class="w-full p-3 mb-4"><option>Yağ Bakımı</option><option>Periyodik Bakım</option></select><input type="date" id="mt-date" class="w-full p-3 mb-4" required><input type="number" id="mt-km" class="w-full p-3 mb-4" required><label class="flex items-center gap-2 mb-4 text-sm text-white"><input type="checkbox" id="mt-reset" checked> Bakım sayacını sıfırla</label><button type="submit" class="btn-3d btn-yellow w-full py-4">Kaydet</button></form></div>
 <div id="modal-insp" class="glass-modal w-full max-w-sm hidden flex-col"><form id="form-insp" class="p-8"><input type="hidden" id="mi-vid"><input type="date" id="mi-date" class="w-full p-3 mb-4" required><input type="text" id="mi-note" class="w-full p-3 mb-4" placeholder="Muayene Notu"><button type="submit" class="btn-3d btn-green w-full py-4">Kaydet</button></form></div>
 <div id="modal-record-edit" class="glass-modal w-full max-w-sm hidden flex-col"><form id="form-record" class="p-8"><input type="hidden" id="rf-id"><input type="hidden" id="rf-mode"><input type="number" id="rf-skm" class="w-full p-3 mb-4 font-black" required><input type="number" id="rf-ekm" class="w-full p-3 mb-4 font-black" required><button type="submit" id="rf-btn" class="btn-3d btn-yellow w-full py-4">Güncelle</button></form></div>

</div>
<script type="module" src="script.js"></script>
</body>
</html>
