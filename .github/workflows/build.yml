name: Build EXE Uygulamasi

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerekli Paketleri Yükle
        run: npm install

      - name: EXE Dosyasını Oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: EXE Dosyasını İndirmeye Hazırla
        uses: actions/upload-artifact@v4
        with:
          name: Numarataj-Filo-Kurulum
          path: dist/*.exe
