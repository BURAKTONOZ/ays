name: Build EXE Uygulamasi

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Node.js Kur
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Gerekli Paketleri Yükle
        run: npm install

      - name: EXE Dosyasını Oluştur
        run: npm run build

      - name: EXE Dosyasını İndirmeye Hazırla
        uses: actions/upload-artifact@v3
        with:
          name: Numarataj-Filo-Kurulum
          path: dist/*.exe
